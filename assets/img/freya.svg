<svg xmlns="http://www.w3.org/2000/svg" width="120" height="160" viewBox="0 0 120 160" role="img" aria-labelledby="freya-titulo">
  <title id="freya-titulo">Freya, la asistente de LovePoints</title>

  <!-- Sombra en el suelo -->
  <ellipse cx="60" cy="150" rx="24" ry="4" fill="#E4DEF7"/>

  <!-- Antena con corazón -->
  <line x1="60" y1="30" x2="60" y2="15" stroke="#7254D1" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 16 C48 8 51 -3 60 3 C69 -3 72 8 60 16 Z" fill="#F2A7C3"/>

  <!-- Brazos -->
  <rect x="17" y="96" width="10" height="30" rx="5" fill="#7254D1"/>
  <rect x="93" y="96" width="10" height="30" rx="5" fill="#7254D1"/>
  <circle cx="22" cy="128" r="5" fill="#F2A7C3"/>
  <circle cx="98" cy="128" r="5" fill="#F2A7C3"/>

  <!-- Cuello y cuerpo -->
  <rect x="52" y="84" width="16" height="8" fill="#5B41B8"/>
  <rect x="30" y="90" width="60" height="46" rx="14" fill="#7254D1"/>

  <!-- Collar Brísingamen -->
  <g fill="#F2A7C3">
    <circle cx="40" cy="96" r="3"/>
    <circle cx="49" cy="101" r="3"/>
    <circle cx="71" cy="101" r="3"/>
    <circle cx="80" cy="96" r="3"/>
    <path d="M60 113 C53 108 54 101 60 104 C66 101 67 108 60 113 Z"/>
  </g>

  <!-- Cabeza -->
  <rect x="25" y="30" width="70" height="56" rx="16" fill="#7254D1"/>
  <rect x="35" y="44" width="50" height="26" rx="13" fill="#F7F5FD"/>

  <!-- Ojos y pestañas -->
  <circle cx="50" cy="57" r="4" fill="#24213A"/>
  <circle cx="70" cy="57" r="4" fill="#24213A"/>
  <path d="M46 52 l-3 -3 M74 52 l3 -3" stroke="#24213A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
