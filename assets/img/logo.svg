<svg xmlns="http://www.w3.org/2000/svg" width="250" height="70" viewBox="0 0 250 70" role="img" aria-labelledby="logo-titulo">
  <title id="logo-titulo">LovePoints</title>

  <!-- Símbolo: cabeza de Freya (misma que en freya.svg, al 75 %) -->
  <g transform="translate(0 4) scale(0.75)">
    <line x1="60" y1="30" x2="60" y2="15" stroke="#7254D1" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 16 C48 8 51 -3 60 3 C69 -3 72 8 60 16 Z" fill="#F2A7C3"/>
    <rect x="25" y="30" width="70" height="56" rx="16" fill="#7254D1"/>
    <rect x="35" y="44" width="50" height="26" rx="13" fill="#F7F5FD"/>
    <circle cx="50" cy="57" r="4" fill="#24213A"/>
    <circle cx="70" cy="57" r="4" fill="#24213A"/>
    <path d="M46 52 l-3 -3 M74 52 l3 -3" stroke="#24213A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Nombre (fuentes del sistema) -->
  <text x="80" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="700" fill="#24213A"><tspan fill="#7254D1">Love</tspan>Points</text>
</svg>
